<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<link rel="icon" type="image/png" href="/images/favicon.png">
<title>店舗LP一覧｜ジョブチャレ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:#faf7f6;
    color:#4a3a3d;
    font-family:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",YuMincho,serif;
    line-height:1.8;
    padding:40px 16px 64px;
  }
  .wrap{max-width:640px;margin:0 auto;}
  h1{
    text-align:center;
    font-size:22px;
    font-weight:600;
    margin:0 0 6px;
    color:#3d2d30;
  }
  .lead{
    text-align:center;
    font-size:12.5px;
    color:#8a7478;
    margin:0 0 32px;
  }
  .group-title{
    font-size:13px;
    letter-spacing:.08em;
    color:#a8636f;
    margin:32px 0 10px;
    padding-left:2px;
  }
  .group-title:first-of-type{margin-top:0;}
  ul{list-style:none;margin:0;padding:0;}
  li + li{margin-top:10px;}
  a.card{
    display:block;
    background:#fff;
    border:1px solid #f0e2e4;
    border-radius:10px;
    padding:16px 18px;
    text-decoration:none;
    color:inherit;
    transition:border-color .15s, transform .15s;
  }
  a.card:hover{
    border-color:#c98b94;
    transform:translateY(-1px);
  }
  .name{
    font-size:15.5px;
    font-weight:600;
    color:#3d2d30;
  }
  .area{
    font-size:12px;
    color:#a08488;
    margin-top:3px;
  }
  footer{
    text-align:center;
    font-size:11px;
    color:#b3a1a4;
    margin-top:48px;
  }
</style>
</head>
<body>
<div class="wrap">

    <li><a class="card" href="/stores/dolce-ragles-gion.html">
